

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your Access Now</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            padding: 40px 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            font-weight: 700;
            color: #111111;
        }
        
        p.subtitle {
            font-size: 16px;
            color: #555555;
            margin-bottom: 35px;
            line-height: 1.5;
        }
        
        form {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        
        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333333;
        }
        
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 24px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #0056b3;
        }
        
        button {
            background-color: #0056b3;
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #004494;
        }
        
        .privacy-notice {
            font-size: 12px;
            color: #888888;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Get Your Access Now</h1>
        <p class="subtitle">Please enter your first name and email address below to continue.</p>
        
        <form action="/go" method="POST">
            
            
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your best email" required>

            <button type="submit">Continue to Offer</button>
        </form>
        
        <p class="privacy-notice">Your information is secure and will not be shared.</p>
    </div>
