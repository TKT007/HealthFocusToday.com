  <script>
    (function () {
      // Tempo do pitch: 35:24 = 2124 segundos de video.
      var PITCH_TIME = 2124;

      var cta = document.getElementById('cta');
      var shown = false;

      function reveal() {
        if (shown) return;
        shown = true;
        cta.classList.add('is-visible');
        // espera o layout recalcular depois do display:block antes de rolar
        requestAnimationFrame(function () {
          cta.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      }

      function bind(player) {
        player.on('timeupdate', function (time) {
          if (time >= PITCH_TIME) reveal();
        });
      }

      // o player registra window.smartplayer.instances de forma assincrona
      var tries = 0;
      (function wait() {
        var sp = window.smartplayer;
        if (sp && sp.instances && sp.instances.length) return bind(sp.instances[0]);
        if (++tries < 600) setTimeout(wait, 200);
      })();
    })();
  </script>
