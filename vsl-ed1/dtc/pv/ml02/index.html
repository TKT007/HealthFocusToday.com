    <script src="../../../assets/pages/dtc/pv/ml02/js/YlRakn4826063.js" charset="utf-8" id="a-js" defer="defer"></script>  <script>
    /* "Only N spots left!" — starts at 250 when the pitch reveals the CTA, not on
       page load, so a lead who sits through the whole VSL still arrives at 250.
       Spots go in bursts and the last few crawl, so the number never runs out
       during the close. */
    (function () {
      var cta = document.querySelector('.dtc-cta');
      if (!cta) return;

      var counter = cta.querySelector('[data-spots-left]');
      var START = 250;
      var FLOOR = 9;
      var storeKey = 'urodtcpvml02_spots_left';

      var left = (function () {
        try {
          var stored = parseInt(window.sessionStorage.getItem(storeKey), 10);
          if (stored >= FLOOR && stored <= START) return stored;
        } catch (e) {}
        return START;
      })();
      if (counter) counter.textContent = left;

      var STALL_FROM = 12;
      function nextDelay() {
        var base;
        if (left > 120) base = 960;
        else if (left > 60) base = 1920;
        else if (left > STALL_FROM) base = 3600;
        else base = 25000 + (STALL_FROM - left) * 7000;   /* the last spots crawl */
        return base + Math.random() * base * 0.8;
      }

      /* The drop gets smaller as the count gets lower: big chunks up top so the
         number moves visibly, single spots once it is near the stall. */
      function nextStep() {
        if (left > 120) return 3 + Math.floor(Math.random() * 3);   /* 3-5 */
        if (left > 60) return 2 + Math.floor(Math.random() * 2);    /* 2-3 */
        if (left > STALL_FROM) return 1 + Math.floor(Math.random() * 2); /* 1-2 */
        return 1;
      }

      function tick() {
        if (left <= FLOOR) return;
        var step = nextStep();
        /* never jump over the stall point — the last spots have to be seen */
        if (left > STALL_FROM && left - step < STALL_FROM) step = left - STALL_FROM;
        left = Math.max(FLOOR, left - step);
        try { window.sessionStorage.setItem(storeKey, left); } catch (e) {}
        if (counter) {
          counter.textContent = left;
          /* the class has to be removed, flushed, then re-added, or the
             animation only ever plays once */
          counter.classList.remove('is-dropping');
          void counter.offsetWidth;
          counter.classList.add('is-dropping');
        }
        window.setTimeout(tick, nextDelay());
      }

      /* Smooth-scroll to the CTA when the pitch reveals it — same behaviour the
         other ml pages have. Native API: these pages carry no jQuery. Honours
         prefers-reduced-motion, like the animations in dtc-cta.css do. */
      function scrollAteCTA() {
        var alvo = document.querySelector('.dtc-cta');
        if (!alvo) return;
        var y = alvo.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop);
        var suave = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        try {
          window.scrollTo({ top: y, behavior: suave ? 'smooth' : 'auto' });
        } catch (e) {
          window.scrollTo(0, y);            /* navegador sem scrollTo por objeto */
        }
      }

      var started = false;
      function start() {
        if (started) return;
        started = true;
        scrollAteCTA();
        window.setTimeout(tick, nextDelay());
      }

      var isVisible = function () {
        return window.getComputedStyle(cta).display !== 'none'
          && cta.getBoundingClientRect().height > 0;
      };

      if (isVisible()) {
        start();
      } else if (window.MutationObserver) {
        /* on this page the class is added/removed on the #cta wrapper
           (atomicat-delay), not on a .esconder — watch the right target */
        var esconder = document.getElementById('cta') || cta;
        var observer = new MutationObserver(function () {
          if (!isVisible()) return;
          observer.disconnect();
          start();
        });
        observer.observe(esconder, { attributes: true, attributeFilter: ['style', 'class'] });
      }
    })();
  </script>
