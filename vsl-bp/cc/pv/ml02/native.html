    <script>
      /* Pitch reveal: the moment vturb.min.js unhides the offer, the page drops
         the headline block below it and the stock counter starts running, so
         the CTA is the only thing left on screen. */
      (function () {
        var offer = document.getElementById("checkout-container");
        if (!offer) return;

        var counter = offer.querySelector("[data-offers-left]");
        var START = 88;
        var FLOOR = 6;
        var storeKey = "ccpvml02_offers_left_v2";

        var read = function () {
          try {
            var stored = parseInt(window.sessionStorage.getItem(storeKey), 10);
            if (stored >= FLOOR && stored <= START) return stored;
          } catch (e) {}
          return START;
        };

        var write = function (value) {
          try {
            window.sessionStorage.setItem(storeKey, value);
          } catch (e) {}
        };

        var left = read();
        if (counter) counter.textContent = left;

        /* Stock moves fast while there is plenty of it and then stalls: below 16
           the wait grows with every unit sold, so the number crawls toward the
           floor instead of running out during the pitch. */
        var STALL_FROM = 16;
        var nextDelay = function () {
          var base;
          if (left > 30) base = 2500;
          else if (left > STALL_FROM) base = 4500;
          else base = 18000 + (STALL_FROM - left) * 9000;
          return base + Math.random() * base * 0.8;
        };

        var tick = function () {
          if (left <= FLOOR) return;
          var step = left > 45 && Math.random() < 0.2 ? 2 : 1;
          left = Math.max(FLOOR, left - step);
          write(left);
          if (counter) {
            counter.textContent = left;
            /* Removing and re-adding the class in one go is not enough to replay
               an animation — the style change has to be flushed in between, so
               each removal is followed by a forced reflow. */
            counter.classList.remove("is-dropping");
            void counter.offsetWidth;
            counter.classList.add("is-dropping");
          }
          window.setTimeout(tick, nextDelay());
        };

        var started = false;
        var start = function () {
          if (started) return;
          started = true;
          document.body.classList.add("is-revealed");
          window.setTimeout(tick, nextDelay());
        };

        var isVisible = function () {
          return window.getComputedStyle(offer).display !== "none";
        };

        if (isVisible()) {
          start();
        } else if (window.MutationObserver) {
          var observer = new MutationObserver(function () {
            if (!isVisible()) return;
            observer.disconnect();
            start();
          });
          observer.observe(offer, { attributes: true, attributeFilter: ["style", "class"] });
        }
      })();
