    <script>
        /* "Only N spots left!" — começa em 250 quando o pitch revela o CTA, não no load
           da página. Transplantado de useslimsoda/dtc/pv/ml02. */
        (function() {
            var cta = document.querySelector('.dtc-cta');
            if (!cta) return;

            var counter = cta.querySelector('[data-spots-left]');
            var START = 250;
            var FLOOR = 9;
            var storeKey = 'pkdccpvml01_spots_left';

            var left = (function() {
                try {
                    var stored = parseInt(window.sessionStorage.getItem(storeKey), 10);
                    if (stored >= FLOOR && stored <= START) return stored;
                } catch (e) {}
                return START;
            })();
            if (counter) counter.textContent = left;

            var STALL_FROM = 12;

            function nextDelay() {
                var base;
                if (left > 120) base = 960;
                else if (left > 60) base = 1920;
                else if (left > STALL_FROM) base = 3600;
                else base = 25000 + (STALL_FROM - left) * 7000; /* as últimas vagas se arrastam */
                return base + Math.random() * base * 0.8;
            }

            function nextStep() {
                if (left > 120) return 3 + Math.floor(Math.random() * 3);
                if (left > 60) return 2 + Math.floor(Math.random() * 2);
                if (left > STALL_FROM) return 1 + Math.floor(Math.random() * 2);
                return 1;
            }

            function tick() {
                if (left <= FLOOR) return;
                var step = nextStep();
                /* nunca pular o ponto de stall — as últimas vagas têm que ser vistas */
                if (left > STALL_FROM && left - step < STALL_FROM) step = left - STALL_FROM;
                left = Math.max(FLOOR, left - step);
                try {
                    window.sessionStorage.setItem(storeKey, left);
                } catch (e) {}
                if (counter) {
                    counter.textContent = left;
                    counter.classList.remove('is-dropping');
                    void counter.offsetWidth;
                    counter.classList.add('is-dropping');
                }
                window.setTimeout(tick, nextDelay());
            }

            var started = false;

            function start() {
                if (started) return;
                started = true;
                window.setTimeout(tick, nextDelay());
            }

            var isVisible = function() {
                return window.getComputedStyle(cta).display !== 'none' &&
                    cta.getBoundingClientRect().height > 0;
            };

            /* no pitch: some o aviso "last chance" abaixo do vídeo e a página desce só o
               necessário para o CTA caber inteiro na tela, sem rolar além disso */
            function onReveal() {
                document.body.classList.add('dtc-revealed');
                window.requestAnimationFrame(function() {
                    var falta = cta.getBoundingClientRect().bottom - window.innerHeight;
                    if (falta > 0) window.scrollBy({
                        top: falta + 16,
                        behavior: 'smooth'
                    });
                });
                start();
            }

            if (isVisible()) {
                onReveal();
            } else if (window.MutationObserver) {
                /* quem o pitch revela é o .esconder em volta (app.js) */
                var revelado = document.querySelector('.dtc-cta-wrap') || cta;
                var observer = new MutationObserver(function() {
                    if (!isVisible()) return;
                    observer.disconnect();
                    onReveal();
                });
                observer.observe(revelado, {
                    attributes: true,
                    attributeFilter: ['style', 'class']
                });
            }
        })();
    </script>
